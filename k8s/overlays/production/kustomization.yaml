apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: baboon

resources:
  - ../../base
  - ingress.yaml

# Override image for production
images:
  - name: baboon
    newName: your-registry/baboon
    newTag: v1.0.0

# Production replica count
replicas:
  - name: baboon
    count: 3

# Production resource patches
patches:
  - patch: |-
      - op: replace
        path: /spec/template/spec/containers/0/resources/requests/cpu
        value: "200m"
      - op: replace
        path: /spec/template/spec/containers/0/resources/requests/memory
        value: "128Mi"
      - op: replace
        path: /spec/template/spec/containers/0/resources/limits/cpu
        value: "1000m"
      - op: replace
        path: /spec/template/spec/containers/0/resources/limits/memory
        value: "512Mi"
    target:
      kind: Deployment
      name: baboon
