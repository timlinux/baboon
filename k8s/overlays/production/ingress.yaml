apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: baboon
  namespace: baboon
  annotations:
    kubernetes.io/ingress.class: nginx

    # STICKY SESSIONS - Critical for maintaining user sessions
    nginx.ingress.kubernetes.io/affinity: "cookie"
    nginx.ingress.kubernetes.io/affinity-mode: "persistent"
    nginx.ingress.kubernetes.io/session-cookie-name: "BABOON_AFFINITY"
    nginx.ingress.kubernetes.io/session-cookie-expires: "10800"
    nginx.ingress.kubernetes.io/session-cookie-max-age: "10800"
    nginx.ingress.kubernetes.io/session-cookie-change-on-failure: "true"
    nginx.ingress.kubernetes.io/session-cookie-samesite: "Lax"

    # SSL configuration
    nginx.ingress.kubernetes.io/ssl-redirect: "true"
    nginx.ingress.kubernetes.io/force-ssl-redirect: "true"

    # Timeouts for long sessions
    nginx.ingress.kubernetes.io/proxy-read-timeout: "3600"
    nginx.ingress.kubernetes.io/proxy-send-timeout: "3600"
    nginx.ingress.kubernetes.io/proxy-connect-timeout: "60"

    # Request limits
    nginx.ingress.kubernetes.io/proxy-body-size: "1m"

    # CORS (if needed for API access from other domains)
    # nginx.ingress.kubernetes.io/enable-cors: "true"
    # nginx.ingress.kubernetes.io/cors-allow-origin: "*"
spec:
  tls:
    - hosts:
        - baboon.example.com
      secretName: baboon-tls
  rules:
    - host: baboon.example.com
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: baboon
                port:
                  number: 80
