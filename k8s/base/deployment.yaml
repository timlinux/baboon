apiVersion: apps/v1
kind: Deployment
metadata:
  name: baboon
  namespace: baboon
  labels:
    app.kubernetes.io/name: baboon
    app.kubernetes.io/component: server
spec:
  replicas: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: baboon
  template:
    metadata:
      labels:
        app.kubernetes.io/name: baboon
        app.kubernetes.io/component: server
    spec:
      containers:
        - name: baboon
          image: baboon:latest
          imagePullPolicy: IfNotPresent
          args:
            - "web"
            - "-port"
            - "8787"
          ports:
            - name: http
              containerPort: 8787
              protocol: TCP
          resources:
            requests:
              cpu: "100m"
              memory: "64Mi"
            limits:
              cpu: "500m"
              memory: "256Mi"
          livenessProbe:
            httpGet:
              path: /api/health
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /api/health
              port: http
            initialDelaySeconds: 3
            periodSeconds: 5
            timeoutSeconds: 2
            failureThreshold: 2
          securityContext:
            runAsNonRoot: true
            runAsUser: 1000
            readOnlyRootFilesystem: true
            allowPrivilegeEscalation: false
          volumeMounts:
            - name: config
              mountPath: /home/baboon/.config/baboon
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: config
          emptyDir: {}
        - name: tmp
          emptyDir: {}
      securityContext:
        fsGroup: 1000
      affinity:
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              podAffinityTerm:
                labelSelector:
                  matchLabels:
                    app.kubernetes.io/name: baboon
                topologyKey: kubernetes.io/hostname
      terminationGracePeriodSeconds: 300
